name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, build, test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      # No --ignore-workspace: this repository declares its own
      # pnpm-workspace.yaml so a fresh clone resolves its own lockfile.
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build

      - name: Unit tests
        run: pnpm run test

      # Runs the recorded SSE fixtures through the real detector engine.
      # Positive fixtures must trip the circuit, negative fixtures must not.
      - name: Detector fixtures
        run: node bin/ocw.js simulate
