# Declares this directory as its own pnpm workspace root.
#
# The parent directory /Users/matador/startups has a pnpm-workspace.yaml that
# does not list opencode-watchdog as a member. pnpm would walk up, resolve the
# parent lockfile, and install nothing here — typecheck then fails with
# "Cannot find type definition file for 'node'". This file makes a fresh clone
# of this repository self-contained.
packages:
  - "."

allowBuilds: {}
